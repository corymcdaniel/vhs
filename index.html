<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#001122" />
    <meta
      name="description"
      content="Cory McDaniel - Web Developer & Photographer from Phoenix, Arizona. Portfolio featuring VHS-themed design with modern web development skills."
    />
    <meta name="keywords" content="Cory McDaniel, web developer, programmer, photographer, Phoenix Arizona, portfolio, VHS aesthetic, frontend developer" />
    <meta name="author" content="Cory McDaniel" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cory McDaniel - Web Developer & Photographer" />
    <meta property="og:description" content="Portfolio of Cory McDaniel - Web Developer & Photographer from Phoenix, Arizona. Experience the retro VHS aesthetic meets modern web development." />
    <meta property="og:url" content="https://corymcdaniel.com" />
    <meta property="og:site_name" content="Cory McDaniel Portfolio" />
    <meta property="og:locale" content="en_US" />
    <!-- Link preview: the VHS screen at 1200x630 -->
    <meta property="og:image" content="https://corymcdaniel.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The VHS-style home screen of corymcdaniel.com: green on-screen text introducing Cory, with a TV dial and nav buttons." />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cory McDaniel - Web Developer & Photographer" />
    <meta name="twitter:description" content="Portfolio featuring VHS-themed design with modern web development skills. Based in Phoenix, Arizona." />
    <meta name="twitter:creator" content="@corymcdaniel" />
    <meta name="twitter:image" content="https://corymcdaniel.com/og-image.jpg" />

    <!-- Additional SEO -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://corymcdaniel.com" />

    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323:wght@400&display=swap" rel="stylesheet">
    <title>Cory McDaniel - Web Developer & Photographer | Phoenix, Arizona</title>

    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Cory McDaniel",
      "jobTitle": ["Web Developer", "Photographer"],
      "description": "Web Developer and Photographer specializing in modern frontend development and photography. Based in Phoenix, Arizona.",
      "url": "https://corymcdaniel.com",
      "sameAs": [
        "https://www.linkedin.com/in/corymcdaniel/",
        "https://www.instagram.com/corymcdaniel"
      ],
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Phoenix",
        "addressRegion": "Arizona",
        "addressCountry": "US"
      },
      "hasOccupation": {
        "@type": "Occupation",
        "name": "Web Developer",
        "occupationLocation": {
          "@type": "City",
          "name": "Phoenix, Arizona"
        }
      },
      "knowsAbout": [
        "Web Development",
        "Frontend Development",
        "React",
        "TypeScript",
        "Photography",
        "VHS Aesthetics",
        "User Interface Design"
      ]
    }
    </script>

    <!-- Google Analytics loads only after the visitor allows it: see src/utils/analytics.ts -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Hidden form for Netlify form detection -->
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" style="display: none;">
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
